<div class="col-12 col-md-6 col-lg-4 col-xl-3 book-item-container">
    <a href="{{.RelPermalink}}#resource-detail"
       title="{{.Title}}"
       class="book-item">
        <div class="cover-wrap">
            {{ with resources.Get .Params.image }}
            {{ with .Resize (printf "%dx webp q70 lanczos" .Width) }}
            <img src="{{.RelPermalink}}" alt="{{$.Title}}" class="card-img-top"/>
            {{end}}
            {{end}}
        </div>
        <div class="card-body">
            <h5 class="card-title">{{.Title}}</h5>
            <p class="authors">{{delimit .Params.authors ", "}}</p>
        </div>
    </a>
</div>
