<header id="site-header">
    <div class="container">
        <div class="header-inner">
            <a href="/" class="site-logo" title="{{ .Site.Title }}">
                {{ with resources.Get "img/logo_header.png" }}
                {{ with .Resize (printf "%dx webp q70 lanczos" .Width) }}
                <img src="{{.RelPermalink}}" alt="{{ $.Site.Title }}">
                {{end}}
                {{end}}
            </a>

            <!-- CSS-only mobile menu toggle -->
            <input type="checkbox" id="nav-toggle" class="nav-toggle-input" hidden>
            <label for="nav-toggle" class="nav-toggle-label" aria-label="Menú">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="site-nav" role="navigation">
                <ul>
                    <li><a href="/#libro">El Libro</a></li>
                    <li><a href="/recursos" class="{{ if eq .RelPermalink "/recursos/" }}active{{ end }}">Recursos</a></li>
                    <li><a href="#autor">El Autor</a></li>
                    <li class="nav-cta"><a href="https://newsletter.gestionarequipos.com/" title="Newsletter">La Newsletter →</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>
