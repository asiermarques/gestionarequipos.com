<section id="resources-summary">
    <div class="container">
        <div class="section-header">
            <h2>Biblioteca</h2>
            <div class="section-desc">
                <p>Últimas recomendaciones sobre <strong>gestión y liderazgo</strong></p>
                <a href="/recursos">Ver toda la biblioteca →</a>
            </div>
        </div>
        <div class="row shelve">
            {{ range first 4 (sort ( where .Site.Pages "Type" "book") "Date" "desc") }}
            {{ partial "resources/book-item.html" . }}
            {{ end }}
        </div>
    </div>
</section>
