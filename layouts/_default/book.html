{{ define "main" }}

<section id="resource-detail">
    <div class="container">
        <p><a href="/recursos" class="back">← volver a la biblioteca</a></p>
        <div class="row gx-lg-5 align-items-start">
            <div class="col-12 col-lg-4 resource-cover">
                {{ with resources.Get .Params.image }}
                {{ with .Resize (printf "%dx webp q70 lanczos" .Width) }}
                <img src="{{.RelPermalink}}" alt="Portada de {{ $.Title }}"/>
                {{end}}
                {{end}}
            </div>
            <div class="col-12 col-lg-8">
                <span class="resource-label">Libro</span>
                <h1>{{.Title}}</h1>
                {{ with .Params.authors }}<p class="authors-line">{{ delimit . ", " }}</p>{{ end }}
                <div class="description">
                    {{.Content}}
                </div>
            </div>
        </div>
    </div>
</section>

{{ partial "newsletter.html" . }}

{{ end }}
